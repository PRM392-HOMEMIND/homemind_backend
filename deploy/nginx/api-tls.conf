server {
    listen 80;
    server_name homemind.ddns.net api.homemind.vn;
    server_tokens off;
    access_log /var/log/nginx/homemind-api-access.log homemind_safe;

    location /.well-known/acme-challenge/ {
        root /var/www/homemind-acme;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name homemind.ddns.net api.homemind.vn;
    server_tokens off;
    access_log /var/log/nginx/homemind-api-access.log homemind_safe;

    ssl_certificate /etc/letsencrypt/live/homemind.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homemind.ddns.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HomeMindTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
