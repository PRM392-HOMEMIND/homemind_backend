name: homemind

services:
  # 1. Backend Core NestJS (Kết nối Supabase Cloud)
  api:
    image: ${APP_IMAGE:-homemind-api:latest}
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    env_file:
      - ${ENV_FILE:-../.env}
    environment:
      RELEASE_SHA: ${RELEASE_SHA:-development}
    expose:
      - '3000'
    networks:
      - homemind-network
    cpus: 2
    mem_limit: 1g
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3000/v1/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  # 2. Nginx Reverse Proxy (Cổng tiếp nhận duy nhất từ Internet cho homemind.ddns.net)
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/log-format.conf:/etc/nginx/conf.d/00-log-format.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_acme:/var/www/homemind-acme:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - homemind-network
    logging: *logging

  # 3. Migration Runner (Công cụ one-shot chạy migration lên Supabase qua DIRECT_URL)
  migrate:
    image: ${MIGRATION_IMAGE:-homemind-migrate:latest}
    build:
      context: ..
      target: migrator
    profiles: [tools]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    env_file:
      - ${ENV_FILE:-../.env}
    networks:
      - homemind-network
    cpus: 2
    mem_limit: 1g
    logging: *logging

volumes:
  certbot_acme:
    name: homemind_certbot_acme

networks:
  homemind-network:
    name: homemind_network
    driver: bridge
